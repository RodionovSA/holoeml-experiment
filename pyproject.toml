[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instruments"]

[project]
name = "holoeml-experiment"
version = "0.2.0"
description = "Package to control experimental setup in holoeml project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "holoeml-processing",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
]

[project.optional-dependencies]
hardware = [
    "libusb-package>=1.0.26",
    "pyqt5-qt5",
    "pyserial>=3.5",
    "pythonnet>=3.0",
    "pyvisa>=1.16.2",
    "pyvisa-py>=0.7.2",
    "thorlabs-tsi-sdk",
    "pco>=2.6.0",
]
cuda = [
    "holoeml-processing[cuda]",
]

[tool.uv.sources]
thorlabs-tsi-sdk = { path = "instruments/pythorcam/thorcam-sdk/Python Toolkit/thorlabs_tsi_camera_python_sdk_package.zip" }
holoeml-processing = { git = "https://github.com/RodionovSA/holoeml-processing.git" }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
