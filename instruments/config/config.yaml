# ── Shared equipment: serial numbers ──────────────────────────────────────────
# Single source of truth for physical device identifiers. Every protocol
# config (amplitude, phase) and standalone script should read these from
# here instead of hardcoding them.
camera_serial: '37490' # Thorlabs camera
focus_serial: '27271402'
stage_x_serial: '27271440'
stage_y_serial: '27271459'
polarizer_serial: '55001180'
piezo_serial: '92100065'
kim_serial: '97251973'   # KIM101 inertial piezo controller
powermeter_serial: '5003886'
spectrometer_serial: 'SR600410'

# ── Monochromator ─────────────────────────────────────────────────────────────
monochromator_port: COM3                 # leave empty to be prompted at runtime
monochromator_grating_mode: VIS Grating  # VIS Grating | IR Grating | Switch Mode

# ── Camera ────────────────────────────────────────────────────────────────────
camera_vendor: 'thorlabs'    # thorlabs | pco
camera_black_level: 0
camera_bit_depth: 'uint16'       # raw frame dtype
camera_out_bit_depth: 'float32'  # output dtype after averaging

# ── Focus motor (shared kinematics; reference position is protocol-specific) ──
default_focus_max_velocity: 0.2  # mm/s
default_focus_acceleration: 0.2  # mm/s²

# ── Sample stage motor along xy (shared kinematics; reference position is protocol-specific) ──
default_stage_max_velocity: 1.0  # mm/s
default_stage_acceleration: 1.0  # mm/s²

# ── Polarizer motor ───────────────────────────────────────────────────────────
polarizer_x_position: 175  # deg
default_polarizer_home_velocity: 10  # deg/s
default_polarizer_max_velocity: 10   # deg/s
default_polarizer_acceleration: 15   # deg/s²

# ── Piezo inertial motor (KIM101) ─────────────────────────────────────────────
kim_channel: 4  # controller channel the PIAK10 actuator is wired to (1-4)

# ── Filter wheel ──────────────────────────────────────────────────────────────
filterwheel_address: 'USB0::0x104D::0x1011::7A01020F12162064::RAW'
filterwheel_timeout: 2000  # ms
filterwheel_empty_pos: 1   # open / no filter
longpass_pos: 3            # long-pass filter
black_pos: 4                # beam block
